<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Chat IA Streaming</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>

body{
    font-family: Arial;
    background:#f4f6f9;
}

.chat-container{
    width:700px;
    margin:auto;
    margin-top:40px;
    background:white;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,.1);
    display:flex;
    flex-direction:column;
    height:600px;
}

.chat-mensajes{
    flex:1;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
}

.mensaje{
    margin-bottom:15px;
    max-width:70%;
    padding:10px 14px;
    border-radius:10px;
}

.usuario{
    background:#d1e7ff;
    align-self:flex-end;
}

.ia{
    background:#eeeeee;
    align-self:flex-start;
}

.chat-input{
    display:flex;
    border-top:1px solid #ddd;
}

.chat-input input{
    flex:1;
    border:none;
    padding:15px;
    font-size:14px;
}

.chat-input button{
    width:120px;
    border:none;
    background:#2b7cff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.cursor{
    display:inline-block;
    width:8px;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{opacity:1;}
    50%{opacity:0;}
    100%{opacity:1;}
}

</style>

</head>

<body>

<div class="chat-container">

<div class="chat-mensajes" id="chat"></div>

<div class="chat-input">
<input id="mensajeUsuario" placeholder="Escribe un mensaje...">
<button onclick="enviarMensaje()">Enviar</button>
</div>

</div>

<script>

let cons_id = 1;

function enviarMensaje(){

    let texto = $("#mensajeUsuario").val();

    if(texto.trim() === "") return;

    $("#mensajeUsuario").val("");

    $("#chat").append(`
        <div class="mensaje usuario">
            ${texto}
        </div>
    `);

    $("#chat").append(`
        <div class="mensaje ia">
            <span class="respuesta"></span><span class="cursor">▋</span>
        </div>
    `);

    $("#chat").scrollTop($("#chat")[0].scrollHeight);

    let mensajes = [
        {
            role:"user",
            parts:[{text:texto}]
        }
    ];

    enviarAGeminiYGuardar(mensajes, cons_id);

}



function enviarAGeminiYGuardar(mensajes, cons_id){

    $.post("/Doc-VerifAI/controller/consulta.php?op=ai_prompt_guardar",
    {
        mensajes: JSON.stringify(mensajes)
    })
    .done(function(){

        iniciarStreaming(cons_id);

    });

}



function iniciarStreaming(cons_id){

    let source = new EventSource("/Doc-VerifAI/controller/consulta.php?op=ai_prompt_stream");

    let respuestaCompleta = "";

    let contenedorRespuesta = $(".respuesta").last();

    source.onopen = function(){

        console.log("Streaming conectado");

    };

    source.onmessage = function(event){

        if(event.data === "[DONE]"){

            source.close();

            $(".cursor").remove();

            $.post("/Doc-VerifAI/controller/consulta.php?op=insertdetalle",
            {
                cons_id: cons_id,
                usu_id: 2,
                det_contenido: respuestaCompleta
            });

            return;

        }

        try{

            let json = JSON.parse(event.data);

            if(json.texto){

                respuestaCompleta += json.texto;

                contenedorRespuesta.text(respuestaCompleta);

                $("#chat").scrollTop($("#chat")[0].scrollHeight);

            }

        }catch(e){

            console.warn("Chunk inválido:", event.data);

        }

    };



    source.onerror = function(err){

        console.error("Error streaming:", err);

        source.close();

    };

}

</script>

</body>
</html>
